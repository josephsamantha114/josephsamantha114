<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 09</title>
<style>
  body { background: white; }

  .container {
    width: 640px;
    padding: 15px;
    background: white;
    
  }

  h1 { font-size: 36px; margin: 0 0 25px 0; padding-left: 10px; }

 
  .box1 { background-color: lightblue; border: 8px double tomato; }

  
  .box2 { background-color: yellow; border: 3px solid dodgerblue; border-radius: 10px; }


  .box3 { background-color: mediumseagreen; border: 10px dotted gray; margin-bottom: 0; }
</style>
</head>
<body>
  <div class="container">
    <h1 class="box1">Hello World</h1>
    <h1 class="box2">Hello World</h1>
    <h1 class="box3">Hello World</h1>
  </div>
</body>
</html>
